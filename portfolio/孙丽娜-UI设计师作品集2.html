function syncDigitalTwinGallery() {
  const main = document.querySelector(".project-detail-main");
  if (!main) return;

  const gallery = main.querySelector(".project-detail-gallery");
  const slug = location.hash.match(/^#\/projects\/([^/?#]+)/)?.[1];
  const project = galleryProjects[slug];
  if (!project) {
    gallery?.remove();
    return;
  }

  main.querySelectorAll(".project-detail-cover, .project-detail-overview, .project-detail-columns").forEach((section) => section.remove());
  if (gallery) return;

  const nextProject = main.querySelector(".project-detail-next");
  const gallerySection = document.createElement("section");
  gallerySection.className = "shell project-detail-gallery";
  gallerySection.setAttribute("aria-label", `${project.title}案例图片`);
  gallerySection.innerHTML = project.screens.map((source, index) => `
    <figure><img src="${source}" alt="${project.title}界面 ${String(index + 1).padStart(2, "0")}" width="1920" height="1080" loading="${index === 0 ? "eager" : "lazy"}" decoding="async"></figure>
  `).join("");
  main.insertBefore(gallerySection, nextProject);
}

function resetProjectScroll() {
  if (!location.hash.startsWith("#/projects/")) return;

  const root = document.documentElement;
  const previousScrollBehavior = root.style.scrollBehavior;
  root.style.scrollBehavior = "auto";
  window.scrollTo(0, 0);
  requestAnimationFrame(() => {
    root.style.scrollBehavior = previousScrollBehavior;
  });
}

function syncBackToTop() {
  const section = document.querySelector(".project-detail-next");
  if (!section || section.dataset.backToTop === "true") return;

  section.dataset.backToTop = "true";
  section.setAttribute("aria-label", "返回顶部");
  section.innerHTML = `
    <button class="shell" type="button">
      <span>BACK TO TOP</span>
      <strong>返回顶部</strong>
      <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M88 104l40-40 40 40M128 64v128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>
    </button>
  `;
}

function enableInstantDetailEntry() {
  document.addEventListener("click", (event) => {
    if (!(event.target instanceof Element)) return;

    const projectLink = event.target.closest('a[href^="#/projects/"]');
    if (!projectLink) return;
    resetProjectScroll();
  }, true);

  document.addEventListener("click", (event) => {
    if (!(event.target instanceof Element)) return;

    const backToTop = event.target.closest(".project-detail-next button");
    if (!backToTop) return;
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

function syncOperationsTags() {
  document.querySelectorAll(".project-feature, .project-detail-page").forEach((section) => {
    if (!section.textContent.includes("后勤中台多端产品")) return;

    section.querySelectorAll(".project-tags span, .project-detail-tags span").forEach((tag) => {
      if (["SaaS", "Pad"].includes(tag.textContent.trim())) tag.remove();
    });
  });
}

function resetProjectPreviewVideo() {
  document.querySelectorAll(".project-showcase .project-media video").forEach((video) => {
    const source = video.querySelector("source")?.src;
    if (!source || video.dataset.source === source) return;

    video.dataset.source = source;
    video.addEventListener("loadeddata", () => {
      video.closest(".project-media")?.classList.remove("is-switching");
    }, { once: true });
  });
}

function enableProjectMediaTransition() {
  if (document.getElementById("project-media-transition-style")) return;

  const style = document.createElement("style");
  style.id = "project-media-transition-style";
  style.textContent = `
    .project-media { position: relative; }
    .project-media.is-switching::after {
      position: absolute;
      z-index: 2;
      inset: 34px;
      border-radius: calc(var(--card-radius) - 4px);
      background: #000;
      content: "";
      pointer-events: none;
    }
    @media (max-width: 1260px) {
      .project-media.is-switching::after { inset: 26px; }
    }
    @media (max-width: 960px) {
      .project-media.is-switching::after { inset: 26px; }
    }
    @media (max-width: 767px) {
      .project-media.is-switching::after { inset: 16px; }
    }
  `;
  document.head.append(style);

  document.addEventListener("click", (event) => {
    if (!(event.target instanceof Element)) return;

    const control = event.target.closest(".project-nav-button, .project-progress button");
    const showcase = control?.closest(".project-showcase");
    showcase?.querySelector(".project-media")?.classList.add("is-switching");
  }, true);
}

if ("scrollRestoration" in history) history.scrollRestoration = "manual";
new MutationObserver(() => {
  syncDigitalTwinGallery();
  syncBackToTop();
  syncOperationsTags();
  resetProjectPreviewVideo();
}).observe(document.body, { childList: true, subtree: true });
window.addEventListener("hashchange", () => {
  resetProjectScroll();
  syncDigitalTwinGallery();
  syncBackToTop();
  syncOperationsTags();
});
resetProjectScroll();
syncDigitalTwinGallery();
syncBackToTop();
syncOperationsTags();
enableProjectMediaTransition();
enableInstantDetailEntry();
resetProjectPreviewVideo();

    <style>.project-detail-gallery {
  display: grid;
  gap: clamp(18px, 2.2vw, 34px);
}

.project-detail-gallery figure {
  position: relative;
  isolation: isolate;
  margin: 0;
  overflow: clip;
  border: 1px solid var(--line);
  border-radius: var(--card-radius);
  background: #0b0f12;
  clip-path: inset(0 round var(--card-radius));
}

.project-detail-gallery img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: calc(var(--card-radius) - 1px);
}

.project-detail-next button {
  display: grid;
  width: min(calc(100% - 96px), 1500px);
  min-height: 280px;
  grid-template-columns: 1fr auto;
  align-content: center;
  align-items: center;
  column-gap: 36px;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
  margin-inline: auto;
}

.project-detail-next button:hover strong {
  color: var(--accent);
}

.project-detail-next button:hover svg {
  transform:translateY(-6px);
}

@media (max-width: 767px) {
  .project-detail-next button {
    width: calc(100% - 32px);
    min-height: 220px;
    column-gap: 20px;
  }
}

@media (min-width: 768px) and (max-width: 960px) {
  .project-detail-next button {
    width: calc(100% - 48px);
  }
}

@media (min-width: 961px) and (max-width: 1260px) {
  .project-detail-next button {
    width: min(calc(100% - 64px), 1160px);
  }
}
</style>
    <style>.project-detail-header {
  left: max(40px, calc((100% - 1540px) / 2));
  width: auto;
  min-height: 0;
  justify-content: flex-start;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  transform: none;
}

@media (max-width: 1023px) {
  .project-detail-header { left: 16px; }
}

.project-detail-back {
  background: rgba(15, 20, 22, 0.56);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    0 12px 32px rgba(0, 0, 0, 0.22);
  -webkit-backdrop-filter: blur(18px) saturate(135%);
  backdrop-filter: blur(18px) saturate(135%);
}

.project-detail-back:hover {
  background: rgba(31, 40, 24, 0.68);
}

.project-media > video {
  background: #000;
  object-fit: contain;
}

.project-showcase:hover .project-media > video {
  transform: none;
}
</style>
  <style id="project-media-transition-style">
    .project-media { position: relative; }
    .project-media.is-switching::after {
      position: absolute;
      z-index: 2;
      inset: 34px;
      border-radius: calc(var(--card-radius) - 4px);
      background: #000;
      content: "";
      pointer-events: none;
    }
    @media (max-width: 1260px) {
      .project-media.is-switching::after { inset: 26px; }
    }
    @media (max-width: 960px) {
      .project-media.is-switching::after { inset: 26px; }
    }
    @media (max-width: 767px) {
      .project-media.is-switching::after { inset: 16px; }
    }
  </style></head>
